name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Install pinned quality tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run frozen ingestion quality gate
        run: make quality COVERAGE_BASE_REF=ee5542edd1ac64b5f66dcb9d0056dd4815739342

      - name: Build release archives
        run: make dist VERSION=${GITHUB_REF_NAME}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/inkbite_${{ github.ref_name }}_source.tar.gz
            dist/inkbite_${{ github.ref_name }}_source.zip
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
